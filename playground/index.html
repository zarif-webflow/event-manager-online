<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script defer type="module" src="http://localhost:3000/number-input.js"></script>
  </head>
  <body>
    <div number-input="wrap" number-input-id="teams" min="3" max="20" step="1" default-val="3">
      <button number-input="decrease" aria-label="Decrease user count">-</button>
      <input type="number" number-input="input" aria-label="Number of users" />
      <button number-input="increase" aria-label="Increase user count">+</button>
    </div>
    <div number-input="wrap" number-input-id="teams" min="3" max="10" step="1" default="3">
      <button number-input="decrease">-</button>
      <input type="number" number-input="input" />
      <button number-input="increase">+</button>
    </div>
    <script src="./webflow-push.js"></script>
  </body>
</html>
